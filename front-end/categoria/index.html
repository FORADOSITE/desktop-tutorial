<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre perfis por categoria no FORA DO SITE.">
    <link rel="icon" type="image/png" href="/front-end/intro/img/fds.png">
    <link rel="stylesheet" href="/front-end/intro/style.css">
    <link rel="stylesheet" href="/front-end/categoria/style.css">
    <title>Perfis | FORA DO SITE</title>
</head>
<body>
    <header class="directory-header">
        <a href="/front-end/intro/" aria-label="Voltar para o início"><img src="/front-end/intro/img/logo.png" alt="FORA DO SITE"></a>
        <a class="directory-back" href="/front-end/intro/">Página inicial <span aria-hidden="true">→</span></a>
    </header>
    <main class="directory-page">
        <p class="eyebrow">TODOS OS PERFIS</p>
        <h1 id="category-title">Perfis</h1>
        <p class="directory-intro">Encontre quem faz a cultura acontecer. Pesquise por nome dentro desta categoria.</p>
        <label class="directory-search" for="profile-search">
            <span aria-hidden="true">⌕</span>
            <input id="profile-search" type="search" placeholder="Pesquisar por nome" autocomplete="off">
        </label>
        <p id="directory-status" class="directory-status" role="status" aria-live="polite">Carregando perfis...</p>
        <section id="profiles-grid" class="directory-grid" aria-live="polite"></section>
    </main>
    <script src="/front-end/categoria/script.js"></script>
</body>
</html>
