<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/front-end/verificar-email/style.css">
    <title>Confirme seu e-mail | FORA DO SITE</title>
</head>
<body>
    <main class="email-box">
        <a href="/front-end/intro/index.html" class="email-brand">FORA DO SITE</a>
        <p class="eyebrow">QUASE LÁ</p>
        <h1>Confirme seu e-mail</h1>
        <p class="description">Enviamos um código e um link de confirmação para <strong id="email">seu e-mail</strong>. Use qualquer uma das opções para continuar o cadastro.</p>
        <div class="notice">O e-mail pode levar alguns minutos. Confira também a pasta de spam.</div>
        <form id="verification-form">
            <label for="verification-code">Código de verificação</label>
            <input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
            <button id="verify-code" type="submit">Confirmar código</button>
        </form>
        <div class="email-actions">
            <button id="resend" type="button">Reenviar e-mail</button>
            <button id="continue" type="button">Já confirmei meu e-mail</button>
        </div>
        <p id="message" role="status"></p>
        <a class="back" href="/front-end/login/index.html">Voltar ao login</a>
    </main>
    <script src="/front-end/verificar-email/script.js"></script>
</body>
</html>
