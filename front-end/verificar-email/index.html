<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/front-end/verificar-email/style.css">
    <title>Confirme seu e-mail | FORA DO SITE</title>
</head>
<body>
    <main class="email-box">
        <a href="/front-end/intro/index.html" class="email-brand">FORA DO SITE</a>
        <p class="eyebrow">QUASE LÁ</p>
        <h1>Confirme seu e-mail</h1>
        <p class="description">Enviamos um link de confirmação para <strong id="email">seu e-mail</strong>. Confirme sua conta e volte para continuar o cadastro.</p>
        <div class="notice">O link pode levar alguns minutos. Confira também a pasta de spam.</div>
        <button id="resend" type="button">Reenviar e-mail</button>
        <button id="continue" type="button">Já confirmei meu e-mail</button>
        <p id="message" role="status"></p>
        <a class="back" href="/front-end/login/index.html">Voltar ao login</a>
    </main>
    <script src="/front-end/verificar-email/script.js"></script>
</body>
</html>
