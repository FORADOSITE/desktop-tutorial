<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verificação documental do seu perfil no FORA DO SITE.">
    <link rel="icon" type="image/png" href="/front-end/intro/img/fds.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front-end/login/style.css">
    <link rel="stylesheet" href="/front-end/verificacao-documento/style.css">
    <title>Verificação | FORA DO SITE</title>
</head>
<body>
    <main class="verification-page">
        <section class="verification-card" aria-labelledby="verification-title">
            <a class="verification-logo" href="/front-end/intro" aria-label="Voltar ao início"><img src="/front-end/intro/img/logo.png" alt="FORA DO SITE"></a>
            <span class="eyebrow" data-testid="verification-step-label">ETAPA 02 / 03 · VERIFICAÇÃO</span>
            <h1 id="verification-title" data-testid="verification-title">DOCUMENTOS<br><em>RECEBIDOS.</em></h1>
            <p data-testid="verification-description">Sua documentação está pronta para a próxima etapa. Escolha como quer apresentar seu trabalho dentro da rede.</p>
            <div class="verification-status" data-testid="verification-status"><span aria-hidden="true">✓</span> Verificação documental concluída para este fluxo</div>
            <button class="verification-button" id="continue-button" data-testid="verification-continue-button" type="button">Continuar para o catálogo <span aria-hidden="true">↗</span></button>
            <a class="verification-back" data-testid="verification-back-link" href="/front-end/login/index.html?cadastro=0">Voltar para o acesso</a>
        </section>
    </main>
    <script>
        document.getElementById("continue-button").addEventListener("click", () => {
            window.location.href = "/front-end/catalogo/index.html";
        });
    </script>
</body>
</html>
