<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verificação de maioridade do FORA DO SITE.">
    <link rel="stylesheet" href="/front-end/intro/style.css">
    <link rel="stylesheet" href="/front-end/verificacao-documento/style.css">
    <title>Verificação de idade | FORA DO SITE</title>
</head>
<body>
    <main class="verification-shell">
        <section class="verification-panel" aria-labelledby="verification-title">
            <a class="verification-brand" href="/front-end/intro/index.html" aria-label="Voltar para o FORA DO SITE">
                <img src="/front-end/intro/img/logo.png" alt="FORA DO SITE">
            </a>
            <p class="eyebrow">VERIFICAÇÃO DE PERFIL</p>
            <h1 id="verification-title">Confirme sua maioridade</h1>
            <p class="intro">Para criar seu perfil, envie fotos legíveis da frente e do verso do seu RG. A frente será usada para conferir sua data de nascimento.</p>

            <form id="verification-form">
                <label for="nome">Nome de usuário</label>
                <input id="nome" name="nome" maxlength="80" required autocomplete="nickname" placeholder="Como você quer aparecer no site">
                <input id="nome-conta" name="nome_conta" type="hidden">

                <label for="data-nascimento">Data de nascimento conforme o RG</label>
                <input id="data-nascimento" name="data_nascimento" type="date" required autocomplete="bday">

                <div class="document-grid">
                    <label class="file-card" for="documento-frente">
                        <strong>RG frente</strong>
                        <span>JPG, PNG ou WEBP até 5 MB</span>
                        <input id="documento-frente" name="documento_frente" type="file" accept="image/jpeg,image/png,image/webp" required>
                    </label>
                    <label class="file-card" for="documento-verso">
                        <strong>RG verso</strong>
                        <span>JPG, PNG ou WEBP até 5 MB</span>
                        <input id="documento-verso" name="documento_verso" type="file" accept="image/jpeg,image/png,image/webp" required>
                    </label>
                </div>

                <label class="consent-row">
                    <input id="aceite-documentos" name="aceite_documentos" type="checkbox" required>
                    <span>Autorizo o uso das imagens exclusivamente para verificar idade e identidade, conforme a política de privacidade.</span>
                </label>

                <p id="status" class="status" role="status" aria-live="polite"></p>
                <button type="submit" class="submit-button">Enviar para verificação</button>
            </form>
        </section>
    </main>
    <script src="/front-end/verificacao-documento/script.js"></script>
</body>
</html>
