<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fora do Site</title>
    
    <!-- Fontes do Google (Barlow Condensed e Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Arquivo CSS Principal e Estilos da Tela de Login -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Header com estético simplificado para a página de Login -->
    <header class="header">
        <div class="header-container" style="padding: 20px 0;">
            <a href="index.html" class="logo">
                <h2 style="font-family: var(--font-title); font-size: 24px; letter-spacing: -1px; text-transform: uppercase;">
                    FORA DO <span style="color: var(--green);">SITE</span>
                </h2>
            </a>
            <a href="index.html" class="btn btn-outline">VOLTAR AO SITE</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">ÁREA DE <span>ACESSO</span></h1>
                <p class="login-subtitle">Entre com as suas credenciais para continuar.</p>
            </div>

            <!-- Feedback de mensagem via JS -->
            <div id="loginAlert" class="alert-message"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                    </div>
                    <span class="field-error" id="emailError">Digite um e-mail válido.</span>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    <div class="input-container">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar senha">
                            👁️
                        </button>
                    </div>
                    <span class="field-error" id="passwordError">A senha deve ter no mínimo 6 caracteres.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-large login-btn">
                    ENTRAR
                </button>
            </form>

            <div class="login-footer">
                <span>Ainda não tem conta?</span>
                <a href="cadastro.html" class="register-link">CRIE UMA AGORA</a>
            </div>
        </div>
    </main>

    <script src="./login.js"></script>
</body>
</html>
